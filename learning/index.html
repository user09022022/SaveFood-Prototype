<script id="learning-data" type="application/json">{"sha": "bc346393897ee6985be9e0ce94398cae8dab75d0", "date": "November 17, 2026", "root": "https://github.com/user09022022/SaveFood-CSIS3175/blob/bc346393897ee6985be9e0ce94398cae8dab75d0/", "lessons": [{"title": "The app and the three modules", "what": "SaveFood connects restaurant managers with customers who want discounted surplus food. The current main branch includes authentication, customer and manager screens, and a shared Room database.", "why": "The team needs one consistent story: a manager publishes food, a customer orders it, and the manager fulfills that same order.", "how": "Irene owns the proposed authentication/profile module; Giovan the customer/order module; Samuel the manager module. These are proposal responsibilities, not claims about who authored every integration line. Shared database integration connects all three.", "files": ["WelcomeActivity", "ManagerHomeActivity", "CustomerHomeActivity"], "exercise": "Open the module map on Overview. Find the Activity and XML for each step of a two-role demonstration.", "question": "How would you describe SaveFood in 30 seconds?", "answer": "Our Java/XML Android app lets managers publish surplus food and customers order it at a discount. Both roles use the same local SQLite database through Room, so stock and order status stay consistent on one installation.", "course": "Approved proposal, sections 3–7; project requirements, pages 1–3."}, {"title": "XML, widgets and resources", "what": "Each implemented screen connects a Java Activity to an activity_*.xml layout. Shared strings, colors, drawables and menus live under res.", "why": "The layout controls what users see; Java decides what happens after an interaction. A preview value is different from a database record.", "how": "setContentView selects the XML. findViewById locates a widget by its ID. A listener validates inputs, opens an Activity or calls the data layer. R is generated from resources.", "files": ["WelcomeActivity", "CheckoutActivity"], "exercise": "Compare activity_checkout.xml with CheckoutActivity. Find the total-price TextView and trace where CartManager.getTotal() is displayed.", "question": "What is the difference between tools:text and android:text?", "answer": "tools:text supplies a design-preview example. android:text supplies a runtime value unless Java replaces it. Neither creates an order in SQLite.", "course": "Course weeks 1–3: layouts, widgets, variables and input."}, {"title": "App startup, Intents and lifecycle", "what": "AndroidManifest.xml still launches WelcomeActivity. Login routes the signed-in account to CustomerHomeActivity or ManagerHomeActivity.", "why": "A saved session does not mean Welcome automatically redirects on startup. Teach the behavior in the actual launcher code.", "how": "onCreate builds the screen and listeners. Intent extras carry values such as search_city, restaurant_id, food_id and order_id. onResume refreshes data on relevant screens after you return; there is no live cloud subscription.", "files": ["WelcomeActivity", "LoginActivity", "CustomerHomeActivity", "OrderStatusActivity"], "exercise": "Find MAIN and LAUNCHER in the Manifest. Then locate CustomerHomeActivity.onResume() and OrderStatusActivity.onResume().", "question": "Why can a refreshed screen show a changed status?", "answer": "The Activity reads its order again through the order manager and DAO. It receives the latest stored row when displayOrder runs. It is not receiving a remote push message.", "course": "Course weeks 2–3: Activities and Intents; Android lifecycle reference."}, {"title": "Registration and real login", "what": "RegisterActivity saves a UserEntity. LoginActivity finds that user by email and verifies the stored password hash.", "why": "The old fixed demo credentials are no longer the authentication model. A fresh app needs accounts registered on that installation.", "how": "Registration checks name, email, phone, address, password of at least eight characters, confirmation and role. Email is lowercased. PasswordHelper hashes the password; UserDao inserts the row. Login checks the role and saves session keys without saving the password.", "files": ["RegisterActivity", "LoginActivity", "PasswordHelper", "UserEntity", "UserDao"], "exercise": "Read saveUser() and loginWithRoom(). Identify the duplicate-email check, PasswordHelper calls and role-routing branch. Use test accounts only when practicing.", "question": "Does signing into this learning page create an Android account?", "answer": "The learning page needs no login and has no Android database connection. In the Android app, each test account must be registered locally. No universal demo password is supplied by this snapshot.", "course": "Course week 9: Room Entity, DAO and insert/query examples; project authentication requirements."}, {"title": "Profile, session and logout", "what": "ProfileActivity reads contact data from users and saves profile edits through UserDao. The session file is savefood_session.", "why": "Account records and login state have different jobs. Clearing a session should not delete the customer's order history.", "how": "SharedPreferences stores is_logged_in, user_id, user_name, user_email and user_role. Profile edits update the users row and cached session name. Logout clears the session and cart, then opens Welcome with the previous task cleared.", "files": ["ProfileActivity", "LoginActivity", "FoodCatalog"], "exercise": "Trace validateProfile() to updateUser(), then returnToWelcome(). Find the code that clears CartManager when the signed-in user changes.", "question": "What survives an ordinary process restart?", "answer": "SQLite records and SharedPreferences normally persist. The static cart does not. Welcome still opens as the launcher. Clearing app data or uninstalling is different from restarting.", "course": "Week 8 CH11: SharedPreferences; week 9: update operations."}, {"title": "Manager setup and food inventory", "what": "A manager without a restaurant enters its name, city and street address on the dashboard. FoodInventoryActivity and AddEditFoodActivity read and update FoodItemEntity rows.", "why": "Food must belong to the signed-in manager's restaurant. Existing orders also need to remain readable after a listing is removed.", "how": "FoodCatalog.restaurantId resolves the first owned restaurant. Inventory filters name, category and date. Add/Edit validates fields and writes through FoodItemDao. Remove deactivates the row (soft removal), preserving order references.", "files": ["ManagerHomeActivity", "FoodInventoryActivity", "AddEditFoodActivity", "FoodItemEntity", "FoodItemDao"], "exercise": "Read requestRestaurant(), loadFoodsFromRoom() and confirmRemoval(). Find how active status affects customer visibility.", "question": "Why retain a removed food row?", "answer": "Order items still reference it. Setting active to false hides the listing without breaking those foreign-key references or losing historical order details.", "course": "Week 9 Product/DAO CRUD example and CW7; manager requirements."}, {"title": "Customer discovery and filtering", "what": "Customer screens now read restaurants and available food through FoodCatalog and the DAOs. SampleData is a legacy example, not the live catalog.", "why": "A new installation can have no restaurants until a manager creates one. The guide must not promise three preloaded restaurants.", "how": "RestaurantListActivity filters saved restaurants by city. RestaurantDetailsActivity filters food by name, category and price. FoodCatalog excludes inactive or zero-stock food. FoodDetailsActivity reloads a selected food row by ID.", "files": ["CustomerHomeActivity", "RestaurantListActivity", "RestaurantDetailsActivity", "FoodDetailsActivity", "FoodCatalog"], "exercise": "Trace FoodCatalog.restaurants() and foods(). Then find the filters in RestaurantDetailsActivity. Explain an empty list without inventing a network error.", "question": "Does location search use GPS or a remote restaurant service?", "answer": "The current restaurant search matches stored city text. The implemented catalog is local SQLite data, so it does not automatically discover real restaurants around a device.", "course": "Course lists/arrays and decision-making; proposal customer workflow."}, {"title": "Cart and checkout", "what": "CartManager remains a static ArrayList of CartItem objects. CheckoutActivity displays quantities, total and Pickup/Delivery, then calls OrderManager.createOrder(context, customerId, type).", "why": "Selection is temporary. A confirmed order becomes a persistent record only after the checkout transaction succeeds.", "how": "The cart accepts one restaurant at a time and checks quantities against the selected food object. Checkout revalidates against the current database. On success the cart clears and Order Status opens with the order ID.", "files": ["CartManager", "CartItem", "CheckoutActivity", "OrderManager"], "exercise": "Find the one-restaurant check in addItem(). Explain why checkout must check current stock again even after a food was added to the cart.", "question": "Is the cart now stored in Room too?", "answer": "No. Confirmed orders use SQLite; the current cart is process memory. Leaving an Activity can keep it, but ending the process loses it. Logout and changing users clear it.", "course": "Java ArrayList, loops and arithmetic; Intents; project order requirements."}, {"title": "Room schema and DAOs", "what": "AppDatabase registers six entities at version 1 in savefood_database. Four DAOs provide access to users, restaurants, food, orders, order lines and reminders.", "why": "Related tables make the customer and manager views read the same stored order rather than maintaining independent demo order lists.", "how": "UserEntity → users; RestaurantEntity → restaurants; FoodItemEntity → food_items; OrdersEntity → orders; OrderItemEntity → order_items; ReminderEntity → reminders. OrderDao handles the final three. Foreign keys link customers, restaurants, food and orders.", "files": ["AppDatabase", "UserDao", "RestaurantDao", "FoodItemDao", "OrderDao", "OrdersEntity", "OrderItemEntity", "ReminderEntity"], "exercise": "Use Database Inspector for read-only inspection. Map one real order ID across orders, order_items and reminders. Keep the database name and schema version unchanged for this study exercise.", "question": "Is Room a second database next to SQLite?", "answer": "Room is the Java access layer over SQLite. Entities describe tables, DAOs declare operations, and AppDatabase supplies the DAO instances.", "course": "Week 9 DatabaseRoomLecture and DatabaseApp: Entity, DAO, RoomDatabase and relationships."}, {"title": "Transactions, stock and price snapshots", "what": "OrderManager.createOrder uses runInTransaction to insert the header and lines, reduce inventory and update the total.", "why": "A partially saved order could reduce stock without a valid purchase. A changed cart line must cause the whole checkout to fail.", "how": "For every line, code checks active status, restaurant, positive quantity, available stock and the current discounted price. An invalid line throws and rolls back the transaction. order_items preserves foodName and unitPrice at purchase time.", "files": ["OrderManager", "OrderItemEntity", "OrderDao"], "exercise": "In the Code explorer, trace insertOrder → each line → insertItem → stock reduction → updateOrder. Predict what happens if the second line has insufficient stock.", "question": "If one line fails, do earlier stock reductions remain?", "answer": "They roll back with the other writes in that transaction. A later menu price change also leaves existing order-line price snapshots unchanged.", "course": "Week 9 relational persistence extended to SaveFood's order rules; cite Room documentation for additional techniques."}, {"title": "Status, cancellation and reminders", "what": "Both roles read the same orders table. Managers change only their restaurant's orders; customer reads are scoped to the current customer.", "why": "A valid state transition prevents completing an unaccepted order or returning stock twice after cancellation or rejection.", "how": "Pending → Accepted or Rejected; Accepted → Ready; Ready → Picked Up for Pickup or Delivered for Delivery. Customers can cancel only Pending orders. Cancel/reject restores stock in the same transaction as status. One Ready reminder is saved per order by the application logic.", "files": ["ManagerOrderStore", "OrderManager", "ManagerOrderDetailsActivity", "OrderStatusActivity"], "exercise": "Use Order lab for success, cancellation and rejection. Switch roles after each change. Then find the equivalent allowed(), cancel() and createReadyReminder() code.", "question": "What does sending a reminder actually do?", "answer": "It inserts a ReminderEntity with message and timestamp. OrderStatusActivity reads it on refresh. It is an in-app stored reminder on the same installation, with no SMS, email, push notification or cross-device synchronization.", "course": "Project status/reminder requirements; proposal sections 7 and 9.4."}, {"title": "Demonstration, evidence and explaining your work", "what": "The merged integration is visible in source. A learning website can verify its own interactions, but cannot certify the Android runtime or complete the PDF report.", "why": "A strong presentation combines a working two-role demonstration with an accurate explanation of the files, tables and business rules.", "how": "On one device: register manager and customer, create restaurant/listing, order, switch roles, accept, mark Ready, save reminder, finish, then check customer history. Repeat cancellation and rejection on separate orders, and restart without clearing data.", "files": ["AppDatabase", "OrderManager", "ManagerOrderStore", "ProfileActivity"], "exercise": "Use Readiness to record your own checks. Run automated Android tests on a disposable emulator to protect existing development data. Rehearse a 15–20 minute presentation including questions.", "question": "What still needs separate submission evidence?", "answer": "The final PDF report, member contributions, use-case/sequence/class/ER diagrams, screenshots, references and a working demonstration. Optional guest access, recovery and profile photos are not implemented in this snapshot.", "course": "Project instructions pages 3–5; course outline AI attribution and own-understanding policy."}], "quiz": [{"q": "Which Activity is the current launcher?", "a": ["MainActivity", "WelcomeActivity", "LoginActivity", "ManagerHomeActivity"], "right": 1, "why": "AndroidManifest.xml declares WelcomeActivity with MAIN and LAUNCHER."}, {"q": "What does setContentView do?", "a": ["Saves a row", "Checks stock", "Loads the screen XML", "Clears the session"], "right": 2, "why": "It attaches the Activity's layout resource to the screen."}, {"q": "Where does login find the account?", "a": ["Fixed demo list", "A remote API", "CartManager", "UserDao.getUserByEmail"], "right": 3, "why": "LoginActivity reads a registered UserEntity and verifies PasswordHelper's stored hash."}, {"q": "What belongs in savefood_session?", "a": ["Plaintext passwords", "User ID, role and login flag", "Every order item", "Food inventory"], "right": 1, "why": "SharedPreferences stores session keys. Account/order/inventory records belong in SQLite."}, {"q": "What happens to the cart after process termination?", "a": ["It is restored from Room", "It becomes a confirmed order", "Its static memory is lost", "It is emailed"], "right": 2, "why": "CartManager is still an in-memory ArrayList, even though confirmed orders are persistent."}, {"q": "Where do current customer listings come from?", "a": ["SampleData only", "A GPS search API", "Room through FoodCatalog", "Six fixed manager orders"], "right": 2, "why": "FoodCatalog reads restaurants and available food rows using the DAOs."}, {"q": "Why might a fresh installation have no restaurants?", "a": ["The server is offline", "A manager has not created one yet", "SQLite cannot store city text", "Login deletes restaurants"], "right": 1, "why": "Live screens use stored data; the legacy sample catalog is not automatically loaded."}, {"q": "Which row represents an order's purchased item and price?", "a": ["OrderItemEntity", "CartManager", "UserEntity", "RestaurantEntity"], "right": 0, "why": "order_items saves quantity, foodName and unitPrice for the purchase."}, {"q": "How many entities does AppDatabase register?", "a": ["Three", "Four", "Six", "Eight"], "right": 2, "why": "users, restaurants, food_items, orders, order_items and reminders."}, {"q": "Why use a transaction at checkout?", "a": ["To start another Activity", "To save all order and stock changes together", "To make SQLite a server", "To persist the cart forever"], "right": 1, "why": "runInTransaction rolls back the writes if a cart line is invalid."}, {"q": "Stock is 5. A valid order for 2 is confirmed. Stock becomes:", "a": ["5 until acceptance", "7", "0", "3"], "right": 3, "why": "OrderManager reduces stock during successful checkout, before manager acceptance."}, {"q": "Which customer cancellation is allowed?", "a": ["Any Delivered order", "Only a Pending order", "Any Ready order", "Only a Rejected order"], "right": 1, "why": "cancel() checks current ownership and Pending before changing status and restoring stock."}, {"q": "What happens after a Pending order is rejected?", "a": ["Stock is restored once", "The account is deleted", "A duplicate order is created", "Stock is consumed again"], "right": 0, "why": "Status change and stock restoration occur in the same transaction. A terminal order cannot be rejected again."}, {"q": "Which transition can complete a Delivery order?", "a": ["Accepted → Delivered", "Pending → Delivered", "Ready → Delivered", "Ready → Picked Up"], "right": 2, "why": "The manager's allowed() rule matches the completion status to fulfillment type."}, {"q": "What is a Ready reminder in this implementation?", "a": ["A push notification", "A saved in-app message and timestamp", "An SMS", "An email with tracking"], "right": 1, "why": "ReminderEntity is saved through OrderDao; customer Order Status reads the row on refresh."}, {"q": "Do two phones automatically share the same orders?", "a": ["Yes, through GitHub", "Yes, through SharedPreferences", "Yes, Room is a cloud database", "No, data is local to each installation"], "right": 3, "why": "Demonstrate account/role switching on one app installation."}, {"q": "Why does food removal set active to false?", "a": ["To erase every old order", "To rotate the screen", "To retain historical references", "To log the manager out"], "right": 2, "why": "Soft removal hides the listing while preserving order references and snapshots."}, {"q": "Which feature is still optional and unavailable?", "a": ["Room account saving", "Pending cancellation", "Email password recovery", "In-app reminder storage"], "right": 2, "why": "The recovery action currently displays a not-ready message; it has no email recovery flow."}], "modules": [{"id": "auth", "name": "Authentication & profile", "owner": "Irene · proposal responsibility", "description": "Registration, login, session, shared profile and logout.", "files": [["WelcomeActivity", "activity_welcome", "Launcher; Login/Register; guest option currently unavailable."], ["RegisterActivity", "activity_register", "Validation, duplicate email check, hash and UserDao insert."], ["LoginActivity", "activity_login", "Registered credentials, session keys and role routing."], ["ProfileActivity", "activity_profile", "Room profile read/update; logout clears session and cart."]]}, {"id": "customer", "name": "Customer & orders", "owner": "Giovan · proposal responsibility", "description": "Discover stored food, select quantities, checkout, track and cancel orders.", "files": [["CustomerHomeActivity", "activity_customer_home", "City search and latest stored order."], ["RestaurantListActivity", "activity_restaurant_list", "Room catalog filtered by city text."], ["RestaurantDetailsActivity", "activity_restaurant_details", "Food filtered by name, category and price."], ["FoodDetailsActivity", "activity_food_details", "Current row, quantity selection and cart add."], ["CheckoutActivity", "activity_checkout", "Cart editing, total, Pickup/Delivery and confirm."], ["OrderStatusActivity", "activity_order_status", "Owned order, Pending cancellation and saved reminder."], ["OrderHistoryActivity", "activity_order_history", "Current customer's stored order list."]]}, {"id": "manager", "name": "Restaurant management", "owner": "Samuel · proposal responsibility", "description": "Set up the restaurant, maintain inventory and process the shared orders.", "files": [["ManagerHomeActivity", "activity_manager_home", "Restaurant setup, inventory summary and active orders."], ["FoodInventoryActivity", "activity_food_inventory", "Room inventory, name/category/date filters and soft removal."], ["AddEditFoodActivity", "activity_add_edit_food", "Validate and insert/update owned restaurant food."], ["ManagerOrdersActivity", "activity_manager_orders", "Active orders for the current manager's restaurant."], ["ManagerOrderDetailsActivity", "activity_manager_order_details", "Allowed status transitions and one Ready reminder."], ["ManagerOrderHistoryActivity", "activity_manager_order_history", "Terminal orders, including Rejected and Cancelled."]]}, {"id": "data", "name": "Shared data & integration", "owner": "Team · shared integration", "description": "Four DAOs and six entities connect the roles; the cart remains temporary.", "files": [["AppDatabase", null, "Room database instance; schema version 1; six entities."], ["UserDao", null, "Insert/read/update users."], ["RestaurantDao", null, "Restaurants and manager ownership."], ["FoodItemDao", null, "Food rows for inventory and discovery."], ["OrderDao", null, "orders, order_items, reminders and stock return."], ["FoodCatalog", null, "Current role/restaurant and Room-to-screen conversions."], ["OrderManager", null, "Transactional checkout, customer-scoped reads and cancellation."], ["ManagerOrderStore", null, "Restaurant-scoped reads, status changes and persistent reminders."], ["CartManager", null, "Process-local cart and one-restaurant rule."]]}], "tables": [{"name": "users", "entity": "UserEntity", "pk": "userId", "dao": "UserDao", "purpose": "Registered accounts; name, email, passwordHash, contact and role.", "fk": "No parent table.", "fields": [{"type": "int", "name": "userId"}, {"type": "String", "name": "name"}, {"type": "String", "name": "email"}, {"type": "String", "name": "passwordHash"}, {"type": "String", "name": "phone"}, {"type": "String", "name": "address"}, {"type": "String", "name": "role"}, {"type": "String", "name": "profilePhoto"}]}, {"name": "restaurants", "entity": "RestaurantEntity", "pk": "restaurantId", "dao": "RestaurantDao", "purpose": "Restaurant name, city, address and manager ownership.", "fk": "managerId → users.userId", "fields": [{"type": "int", "name": "restaurantId"}, {"type": "int", "name": "managerId"}, {"type": "String", "name": "name"}, {"type": "String", "name": "city"}, {"type": "String", "name": "address"}]}, {"name": "food_items", "entity": "FoodItemEntity", "pk": "foodItemId", "dao": "FoodItemDao", "purpose": "Food details, prices, quantity, availability and active status.", "fk": "restaurantId → restaurants.restaurantId", "fields": [{"type": "int", "name": "foodItemId"}, {"type": "int", "name": "restaurantId"}, {"type": "String", "name": "name"}, {"type": "String", "name": "description"}, {"type": "String", "name": "category"}, {"type": "double", "name": "originalPrice"}, {"type": "double", "name": "discountedPrice"}, {"type": "int", "name": "quantity"}, {"type": "String", "name": "availableDate"}, {"type": "String", "name": "availableTime"}, {"type": "boolean", "name": "active"}]}, {"name": "orders", "entity": "OrdersEntity", "pk": "orderId", "dao": "OrderDao", "purpose": "Customer, restaurant, date, fulfillment, status and total.", "fk": "customerId → users.userId; restaurantId → restaurants.restaurantId", "fields": [{"type": "int", "name": "orderId"}, {"type": "int", "name": "customerId"}, {"type": "int", "name": "restaurantId"}, {"type": "String", "name": "orderDate"}, {"type": "String", "name": "fulfillmentType"}, {"type": "String", "name": "status"}, {"type": "double", "name": "totalAmount"}]}, {"name": "order_items", "entity": "OrderItemEntity", "pk": "orderItemId", "dao": "OrderDao", "purpose": "Purchased quantity, foodName and unitPrice snapshots.", "fk": "orderId → orders.orderId; foodItemId → food_items.foodItemId", "fields": [{"type": "int", "name": "orderItemId"}, {"type": "int", "name": "orderId"}, {"type": "int", "name": "foodItemId"}, {"type": "String", "name": "foodName"}, {"type": "int", "name": "quantity"}, {"type": "double", "name": "unitPrice"}]}, {"name": "reminders", "entity": "ReminderEntity", "pk": "reminderId", "dao": "OrderDao", "purpose": "Message and reminderDateTime for an order.", "fk": "orderId → orders.orderId", "fields": [{"type": "int", "name": "reminderId"}, {"type": "int", "name": "orderId"}, {"type": "String", "name": "message"}, {"type": "String", "name": "reminderDateTime"}]}], "code": [{"file": "WelcomeActivity.java", "path": "SaveFood/app/src/main/java/com/example/savefood/WelcomeActivity.java", "line": 16, "snippet": "        setContentView(R.layout.activity_welcome);\n\n        Button loginButton = findViewById(R.id.btnWelcomeLogin);\n        Button registerButton = findViewById(R.id.btnWelcomeRegister);\n        TextView guestOption = findViewById(R.id.txtWelcomeGuest);\n\n        // Open the login form. Authentication is not implemented yet.\n        loginButton.setOnClickListener(v ->", "title": "XML to Java", "explain": "Loads XML and resolves widgets by their generated R IDs."}, {"file": "RegisterActivity.java", "path": "SaveFood/app/src/main/java/com/example/savefood/RegisterActivity.java", "line": 150, "snippet": "        // Check if the email is already registered.\n        if (dao.getUserByEmail(email) != null) {\n            Toast.makeText(this, \"Email already registered\",\n                    Toast.LENGTH_LONG).show();\n            return;\n        }\n\n        // Create a new user.\n        UserEntity user = new UserEntity();\n        user.setName(name);\n        user.setEmail(email);\n        user.setPhone(phone);\n        user.setAddress(address);\n        user.setRole(role);\n\n        try {\n            // Protect the password before saving.\n            user.setPasswordHash(\n                    PasswordHelper.hashPassword(password));\n", "title": "Register a real account", "explain": "Duplicate email validation and the UserEntity fields saved through Room."}, {"file": "LoginActivity.java", "path": "SaveFood/app/src/main/java/com/example/savefood/LoginActivity.java", "line": 95, "snippet": "            UserEntity user = dao.getUserByEmail(\n                    email.toLowerCase(Locale.ROOT));\n\n            // Check the password.\n            if (user == null ||\n                    !PasswordHelper.verifyPassword(\n                            password, user.getPasswordHash())) {\n\n                Toast.makeText(this, \"Invalid email or password\",\n                        Toast.LENGTH_SHORT).show();\n                return;\n            }\n\n            // Check the account role.\n            String role = user.getRole();\n\n            if (!\"customer\".equals(role) &&\n                    !\"manager\".equals(role)) {\n\n                Toast.makeText(this, \"Invalid account role\",\n                        Toast.LENGTH_SHORT).show();\n                return;\n            }\n\n            // Save the session without the password.", "title": "Authenticate with Room", "explain": "Read the registered user, check the password hash and validate the stored role."}, {"file": "ProfileActivity.java", "path": "SaveFood/app/src/main/java/com/example/savefood/ProfileActivity.java", "line": 189, "snippet": "            // Update the user's information.\n            user.setName(name);\n            user.setPhone(phone);\n            user.setAddress(address);\n\n            // Save the changes in SQLite.\n            dao.updateUser(user);\n\n            // Update the name stored in the login session.\n            session.edit()\n                    .putString(KEY_USER_NAME, name)\n                    .apply();\n\n            displayName.setText(name);\n            statusMessage.setText(R.string.profile_save_success);\n\n            Toast.makeText(this, R.string.profile_save_success,\n                    Toast.LENGTH_SHORT).show();\n\n        } catch (Exception e) {", "title": "Persist profile changes", "explain": "Save users through UserDao and refresh the cached session name."}, {"file": "AppDatabase.java", "path": "SaveFood/app/src/main/java/com/example/savefood/AppDatabase.java", "line": 10, "snippet": "@Database(\n        entities = {\n                UserEntity.class,\n                RestaurantEntity.class,\n                FoodItemEntity.class,\n                OrdersEntity.class,\n                OrderItemEntity.class,\n                ReminderEntity.class\n        },\n        version = 1,\n        exportSchema = false\n)\npublic abstract class AppDatabase extends RoomDatabase {\n\n    // One shared database instance\n    private static AppDatabase instance;\n\n    public abstract OrderDao orderDao();", "title": "Six tables, one database", "explain": "Entities register the schema. The database class supplies four DAO interfaces."}, {"file": "AppDatabase.java", "path": "SaveFood/app/src/main/java/com/example/savefood/AppDatabase.java", "line": 39, "snippet": "    public static synchronized AppDatabase getDatabase(\n            Context context) {\n        if (instance == null) {\n            instance = Room.databaseBuilder(\n                            context.getApplicationContext(),\n                            AppDatabase.class,\n                            \"savefood_database\"\n                    )\n                    .allowMainThreadQueries()\n                    .build();\n        }\n        return instance;\n    }\n}\n", "title": "Open the shared SQLite file", "explain": "The singleton wraps savefood_database. Main-thread queries are retained in this classroom design."}, {"file": "FoodCatalog.java", "path": "SaveFood/app/src/main/java/com/example/savefood/FoodCatalog.java", "line": 34, "snippet": "    static ArrayList<FoodItem> foods(Context context, int restaurantId) {\n        ArrayList<FoodItem> result = new ArrayList<>();\n        for (FoodItemEntity row : AppDatabase.getDatabase(context).foodItemDao().getFoodsByRestaurantId(restaurantId)) {\n            FoodItem food = available(row);\n            if (food != null) result.add(food);\n        }\n        return result;\n    }\n}\n", "title": "Read the customer catalog", "explain": "Rows are converted to screen models; available() excludes inactive or zero-stock items."}, {"file": "CartManager.java", "path": "SaveFood/app/src/main/java/com/example/savefood/CartManager.java", "line": 22, "snippet": "        // For now, one order belongs to one restaurant\n        if (!cartItems.isEmpty()) {\n\n            int restaurantId = getRestaurantId();\n\n            if (food.getRestaurantId() != restaurantId) {\n                return false;\n            }\n        }\n", "title": "Keep one restaurant per cart", "explain": "A second restaurant is rejected while the cart already contains items."}, {"file": "OrderManager.java", "path": "SaveFood/app/src/main/java/com/example/savefood/OrderManager.java", "line": 34, "snippet": "            db.runInTransaction(() -> {\n                OrderDao dao = db.orderDao();\n                order.setOrderId((int) dao.insertOrder(order));\n                double total = 0;\n                for (CartItem cart : CartManager.getItems()) {\n                    FoodItemEntity food = db.foodItemDao().getFoodById(cart.getFoodItem().getFoodId());\n                    int qty = cart.getQuantity();\n                    if (food == null || !food.isActive() || food.getRestaurantId() != order.getRestaurantId()\n                            || qty < 1 || qty > food.getQuantity()\n                            || food.getDiscountedPrice() != cart.getFoodItem().getDiscountedPrice()) {\n                        throw new IllegalStateException(\"Cart item has changed\");\n                    }\n                    OrderItemEntity item = new OrderItemEntity();\n                    item.setOrderId(order.getOrderId());\n                    item.setFoodItemId(food.getFoodItemId());\n                    item.setFoodName(food.getName());\n                    item.setQuantity(qty);\n                    item.setUnitPrice(food.getDiscountedPrice());\n                    dao.insertItem(item);\n                    food.setQuantity(food.getQuantity() - qty);\n                    db.foodItemDao().updateFoodItem(food);\n                    total += qty * item.getUnitPrice();\n                }\n                order.setTotalAmount(total);\n                dao.updateOrder(order);\n            });\n        } catch (IllegalStateException | android.database.sqlite.SQLiteException exception) {", "title": "Checkout as one transaction", "explain": "Check current price and stock, insert lines, reduce quantities and calculate the total. Excerpt continues through the total update."}, {"file": "OrderManager.java", "path": "SaveFood/app/src/main/java/com/example/savefood/OrderManager.java", "line": 95, "snippet": "    static void cancel(Context context, int id) {\n        AppDatabase db = AppDatabase.getDatabase(context);\n        db.runInTransaction(() -> {\n            OrdersEntity row = db.orderDao().byId(id);\n            if (row == null || row.getCustomerId() != FoodCatalog.userId(context, \"customer\")\n                    || !\"Pending\".equals(row.getStatus())) return;\n            row.setStatus(\"Cancelled\");\n            db.orderDao().updateOrder(row);\n            restoreStock(db.orderDao(), id);\n        });\n    }\n}\n", "title": "Cancel only Pending", "explain": "Owned Pending orders change status and return stock within one transaction."}, {"file": "ManagerOrderStore.java", "path": "SaveFood/app/src/main/java/com/example/savefood/ManagerOrderStore.java", "line": 38, "snippet": "    static boolean changeStatus(Context context, int id, String nextStatus) {\n        AppDatabase db = AppDatabase.getDatabase(context);\n        return db.runInTransaction(() -> {\n            OrdersEntity row = db.orderDao().byId(id);\n            if (row == null || row.getRestaurantId() != FoodCatalog.restaurantId(context)\n                    || !allowed(row, nextStatus)) return false;\n            row.setStatus(nextStatus);\n            db.orderDao().updateOrder(row);\n            if (\"Rejected\".equals(nextStatus)) OrderManager.restoreStock(db.orderDao(), id);\n            return true;\n        });\n    }\n\n    private static boolean allowed(OrdersEntity row, String nextStatus) {", "title": "Update the shared order", "explain": "The manager checks restaurant ownership and transition rules; rejection returns stock."}, {"file": "ManagerOrderStore.java", "path": "SaveFood/app/src/main/java/com/example/savefood/ManagerOrderStore.java", "line": 51, "snippet": "    private static boolean allowed(OrdersEntity row, String nextStatus) {\n        String current = row.getStatus();\n        boolean permitted = false;\n        if (current.equals(\"Pending\")) {\n            permitted = nextStatus.equals(\"Accepted\") || nextStatus.equals(\"Rejected\");\n        } else if (current.equals(\"Accepted\")) {\n            permitted = nextStatus.equals(\"Ready\");\n        } else if (current.equals(\"Ready\")) {\n            permitted = (row.getFulfillmentType().equals(\"Pickup\") && nextStatus.equals(\"Picked Up\"))\n                    || (row.getFulfillmentType().equals(\"Delivery\") && nextStatus.equals(\"Delivered\"));\n        }\n\n        return permitted;\n    }\n\n    static ManagerReminder getReminderForOrder(Context context, int id) {\n        if (findById(context, id) == null) return null;\n        ReminderEntity row = AppDatabase.getDatabase(context).orderDao().reminder(id);", "title": "Enforce the lifecycle", "explain": "The current status and Pickup/Delivery type determine valid next states."}, {"file": "ManagerOrderStore.java", "path": "SaveFood/app/src/main/java/com/example/savefood/ManagerOrderStore.java", "line": 72, "snippet": "    static ManagerReminder createReadyReminder(Context context, int id) {\n        AppDatabase db = AppDatabase.getDatabase(context);\n        return db.runInTransaction(() -> {\n            ManagerOrder order = findById(context, id);\n            if (order == null || !\"Ready\".equals(order.getStatus()) || db.orderDao().reminder(id) != null) return null;\n            ReminderEntity row = new ReminderEntity();\n            row.setOrderId(id);\n            row.setMessage(\"Your SaveFood order #\" + id + \" is ready for \" +\n                    order.getFulfillmentType().toLowerCase(java.util.Locale.CANADA) + \".\");\n            row.setReminderDateTime(OrderManager.now());\n            db.orderDao().insertReminder(row);\n            return getReminderForOrder(context, id);\n        });\n    }\n}\n", "title": "Persist one Ready reminder", "explain": "The code checks status and duplicates, then saves message and timestamp through OrderDao."}, {"file": "OrderDao.java", "path": "SaveFood/app/src/main/java/com/example/savefood/OrderDao.java", "line": 19, "snippet": "    @Query(\"SELECT * FROM orders WHERE customerId = :id ORDER BY orderId\")\n    List<OrdersEntity> forCustomer(int id);\n\n    @Query(\"SELECT * FROM orders WHERE restaurantId = :id ORDER BY orderId DESC\")\n    List<OrdersEntity> forRestaurant(int id);\n\n    @Query(\"SELECT * FROM order_items WHERE orderId = :id ORDER BY orderItemId\")\n    List<OrderItemEntity> items(int id);\n\n    @Query(\"SELECT * FROM reminders WHERE orderId = :id ORDER BY reminderId DESC LIMIT 1\")\n    ReminderEntity reminder(int id);\n\n    @Query(\"UPDATE food_items SET quantity = quantity + :amount WHERE foodItemId = :id\")\n    void returnStock(int id, int amount);", "title": "Read related order rows", "explain": "DAO queries scope orders by customer/restaurant and retrieve lines/reminders."}, {"file": "OrderStatusActivity.java", "path": "SaveFood/app/src/main/java/com/example/savefood/OrderStatusActivity.java", "line": 232, "snippet": "        findViewById(R.id.btnCancelOrder).setEnabled(\"Pending\".equals(order.getStatus()));\n        ReminderEntity reminder = AppDatabase.getDatabase(this).orderDao().reminder(orderId);\n        reminderText.setText(reminder == null ? \"No reminders have been received yet.\"\n                : reminder.getReminderDateTime() + \"  \" + reminder.getMessage());\n    }", "title": "Show the stored reminder", "explain": "Order Status displays the latest saved reminder and enables cancellation only for Pending."}], "requirements": [["Authentication & profile", "Registration, hashed credential verification, role routing, Room contact edits and logout are implemented in source.", "Recheck valid/invalid login, duplicate email, profile persistence and account switching."], ["Customer browsing", "Local restaurant city search; available food; name/category/price filtering and food details.", "Use a manager-created listing; verify empty, inactive and out-of-stock states."], ["Cart & confirmation", "Single-restaurant cart; quantities, total, Pickup/Delivery; transactional saved orders.", "Check stale price/stock, invalid quantity, rollback and multiple lines."], ["Manager food", "Restaurant setup, add/edit, name/category/date filters and deactivation.", "Verify field validation, owned-restaurant scope and historical references."], ["Shared orders", "Both roles read orders; manager status rules; Pending cancellation/rejection restores stock.", "On one installation verify accept → Ready → completion, cancel and reject on separate orders."], ["Reminders & history", "Stored in-app reminder at Ready; shared status and line snapshots; role-scoped histories.", "Refresh customer Order Status; compare order IDs, total, message/time after restart."], ["Persistence", "Six Room entities; four DAOs; SharedPreferences session; temporary static cart.", "Restart without clearing app data. Check saved records/session and loss of cart."], ["Optional additions", "Guest browsing and password recovery show unavailable messages; profile photo flow is absent.", "Describe these honestly as unavailable; do not promise email, GPS or cross-device sync."], ["Final report & presentation", "Separate coursework deliverables, not completed by this learning guide.", "PDF report, contributions, use-case/sequence/class/ER diagrams, screenshots, references and demo."]]}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('learning-data').textContent);
const SECTIONS=[['overview','◫','Overview'],['lessons','◎','Learning path'],['code','⌘','Code explorer'],['database','▤','Database & data'],['lab','⇄','Order lab'],['quiz','✦','Knowledge check'],['readiness','☑','Readiness'],['resources','↗','Resources']];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toFixed(2);
let storageOK=true;
function read(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){storageOK=false;return fallback}}

const PROGRESS_KEY='savefood-learning-room-v2';
const PRACTICE_KEY='savefood-practice-room-v2';
let progress=read(PROGRESS_KEY,{lessons:[],checks:[],quizBest:0});
if(!progress||!Array.isArray(progress.lessons)||!Array.isArray(progress.checks))progress={lessons:[],checks:[],quizBest:0};
function seed(){return{role:'customer',stock:5,price:4,active:true,orders:[],nextId:1,log:['Practice dataset created: 5 units at $4.00. This is invented browser data.']}}
let sim=read(PRACTICE_KEY,seed());if(!sim||!Array.isArray(sim.orders))sim=seed();
let cart=null;
let view='overview',moduleId='customer',lessonIndex=0,codeIndex=0,tableIndex=0;
let quizIndex=0,quizChoice=null,quizScore=0;
function source(cls){return D.root+'SaveFood/app/src/main/java/com/example/savefood/'+cls+'.java'}
function chip(cls){return '<a href="'+esc(source(cls))+'" target="_blank" rel="noopener">'+esc(cls)+'.java ↗</a>'}
function intro(no,title,lead){return '<div class="subhead"><div class="eyebrow">'+no+' / SaveFood from the current code</div><h1>'+title+'</h1><p class="lead">'+lead+'</p></div>'}

function go(name){view=SECTIONS.some(s=>s[0]===name)?name:'overview';$('#nav').innerHTML=SECTIONS.map((s,i)=>'<a href="#'+s[0]+'" class="'+(s[0]===view?'active':'')+'" '+(s[0]===view?'aria-current="page"':'')+'><span aria-hidden="true">'+s[1]+'</span>'+s[2]+'<small>'+String(i+1).padStart(2,'0')+'</small></a>').join('');$('#crumb').textContent=SECTIONS.find(s=>s[0]===view)[2];render();window.scrollTo({top:0,behavior:'instant'})}
function overview(){
 const m=D.modules.find(m=>m.id===moduleId);
 return '<div class="hero"><div><div class="eyebrow">main updated · Room integration merged</div><h1>Know the app.<br><em>Explain the code.</em></h1><p class="lead">The SaveFood you have now: real local accounts, shared orders, persistent reminders and stock that follows the order lifecycle.</p><div class="hero-actions"><a class="button lime" href="#lessons">Start learning →</a><a class="button" href="#lab">Practice one order ↗</a></div><div class="pills"><span class="tag">Java + XML</span><span class="tag">Room / SQLite</span><span class="tag">One installation · two roles</span></div></div><div class="hero-art" aria-hidden="true"><span class="tag">SHARED ORDER</span><h3>Good food.<br>Connected workflows.</h3><div class="food">🥪</div><div class="mini-row"><b>Order #1 · Pickup</b><b>$8.00</b></div><div class="mini-row" style="margin-top:13px"><span>Customer ↔ Manager</span><span class="tag">Ready</span></div></div></div>'+
 '<div class="notice"><b>Updated November 17, 2026.</b> This guide is based on merged main, PR #12, commit <a href="'+D.root.replace('/blob/','/commit/').replace(/\/$/,'')+'" target="_blank" rel="noopener">'+D.sha.slice(0,7)+'</a>. It replaces the older guide’s separate demo-order-store explanation. This website is a teaching model; Android runtime testing remains a separate check.</div>'+
 '<div class="grid4"><div class="card stat"><b>12</b><span>guided lessons</span></div><div class="card stat"><b>6 / 4</b><span>Room tables / DAOs</span></div><div class="card stat"><b>15</b><span>current code excerpts</span></div><div class="card stat"><b>18</b><span>questions with feedback</span></div></div>'+
 '<div class="section-head"><h2>What changed in the project?</h2><span class="small">Old assumptions have been retired</span></div><div class="grid2"><div class="card"><span class="tag">Persistent business data</span><h3>Both roles read the same order.</h3><p>OrderManager and ManagerOrderStore now access Room through OrderDao. Checkout reserves stock; rejection and Pending cancellation restore it. Ready reminders are saved rows.</p><a href="#database" class="small">Follow the data →</a></div><div class="card"><span class="tag warm">Temporary selection</span><h3>The cart still lives in memory.</h3><p>CartManager remains a static ArrayList. Accounts, food, confirmed orders and reminders persist; a process restart loses an unconfirmed cart. SharedPreferences retains session keys.</p><a href="#lessons" class="small">Understand the difference →</a></div></div>'+
 '<div class="section-head"><h2>Find your way around the app.</h2><span class="small">17 implemented Activity/layout pairs</span></div><div class="tabs" role="group" aria-label="Project modules">'+D.modules.map(x=>'<button data-module="'+x.id+'" class="'+(x.id===moduleId?'selected':'')+'" aria-pressed="'+(x.id===moduleId)+'">'+esc(x.name)+'</button>').join('')+'</div><div class="card"><span class="eyebrow">'+esc(m.owner)+'</span><h3>'+esc(m.name)+'</h3><p>'+esc(m.description)+'</p>'+m.files.map(f=>'<div class="file-row"><div><b>'+esc(f[0])+'.java</b><p>'+esc(f[2])+'</p>'+(f[1]?'<span class="tiny">'+esc(f[1])+'.xml</span>':'')+'</div><div class="file-links"><a href="'+source(f[0])+'" target="_blank" rel="noopener">Java ↗</a>'+(f[1]?'<a href="'+D.root+'SaveFood/app/src/main/res/layout/'+f[1]+'.xml" target="_blank" rel="noopener">XML ↗</a>':'')+'</div></div>').join('')+'</div>'+
 '<div class="notice warm"><b>Source notes.</b> MainActivity/activity_main is a retained starter pair. SampleData and ManagerInventoryStore are legacy examples; live screens use FoodCatalog and the DAOs. Some old comments and the outer README still describe starter behavior. This guide follows the executable code and the newer inner SaveFood/README.md.</div>';
}
function lessonBody(i,printMode=false){const l=D.lessons[i];const done=progress.lessons.includes(i);return '<article class="card lesson"><span class="tag">Lesson '+String(i+1).padStart(2,'0')+' / '+D.lessons.length+'</span><h2>'+esc(l.title)+'</h2><h4>What we have</h4><p>'+esc(l.what)+'</p><h4>Why it matters</h4><p>'+esc(l.why)+'</p><h4>How the code works</h4><p>'+esc(l.how)+'</p><div class="source-chips">'+l.files.map(chip).join('')+'</div><div class="exercise"><b>Try it in Android Studio</b><p>'+esc(l.exercise)+'</p></div><details '+(printMode?'open':'')+'><summary>Checkpoint: '+esc(l.question)+'</summary><p>'+esc(l.answer)+'</p></details><p class="tiny">Course connection: '+esc(l.course)+'</p>'+(printMode?'':'<div class="lesson-actions"><button data-lesson-move="-1" '+(i===0?'disabled':'')+'>← Previous</button><button class="primary" data-understood="'+i+'">'+(done?'✓ Understood — mark for review':'Mark understood')+'</button><button data-lesson-move="1" '+(i===D.lessons.length-1?'disabled':'')+'>Next →</button></div>')+'</article>'}
function lessons(){return intro('02','Learn in a logical order.','Study one lesson, inspect its real files, try the exercise, then explain the checkpoint aloud. The database is already integrated in this snapshot.')+'<div class="notice">This updated edition uses a fresh progress key because the lessons changed. Earlier quiz scores and completion marks were not carried over.</div><div class="study-grid"><div class="picklist">'+D.lessons.map((l,i)=>'<button data-lesson="'+i+'" class="'+(i===lessonIndex?'selected':'')+'" aria-pressed="'+(i===lessonIndex)+'"><span class="no">'+String(i+1).padStart(2,'0')+'</span><b>'+esc(l.title)+'</b><span class="done">'+(progress.lessons.includes(i)?'✓':'')+'</span></button>').join('')+'</div><div>'+lessonBody(lessonIndex)+'</div></div>'}
function codeView(){const c=D.code[codeIndex];return intro('03','Read the actual implementation.','These are short, unchanged excerpts from the merged commit. Open the full private source to see the surrounding validation, error handling and calls.')+'<div class="study-grid"><div class="picklist code-list">'+D.code.map((x,i)=>'<button data-code="'+i+'" class="'+(codeIndex===i?'selected':'')+'"><span><b>'+esc(x.title)+'</b><small>'+esc(x.file)+'</small></span></button>').join('')+'</div><div class="card"><span class="tag">Exact source excerpt · '+D.sha.slice(0,7)+'</span><h2>'+esc(c.title)+'</h2><p>'+esc(c.explain)+'</p><div class="codebox"><div class="label">'+esc(c.file)+' · starting at line '+c.line+'</div><pre><code style="color:inherit;font:inherit">'+esc(c.snippet)+'</code></pre></div><a class="button primary" href="'+D.root+c.path+'#L'+c.line+'" target="_blank" rel="noopener">Open full source ↗</a><button data-action="copy-code">Copy excerpt</button><div class="notice"><b>Explain it:</b> identify the input, the condition being checked, the data it reads or writes, and what the caller does with the result.</div></div></div>'}
function database(){const t=D.tables[tableIndex];return intro('04','One local database. Connected roles.','Room wraps SQLite. The six entities describe the tables; the four DAO interfaces describe how Java reads and writes them. Both roles use the same file on the same installation.')+
 '<div class="grid2"><div class="card"><h3>Read and write path</h3><div class="diagram"><div class="relation"><b>Customer Activities</b><br>FoodCatalog / OrderManager</div><div class="relation"><b>Manager Activities</b><br>FoodCatalog / ManagerOrderStore</div><div class="arrow-label">Both call AppDatabase and its DAOs ↓</div><div class="db-node">savefood_database<br><span style="font-size:10px;color:#c2d8b7">Schema version 1 · six Room entities</span></div></div></div><div class="card"><h3>Three different lifetimes</h3><div class="stack"><div class="relation"><b>SQLite / Room</b><br>Users, restaurants, food, confirmed orders, lines and reminders. Persist after ordinary restart.</div><div class="relation"><b>SharedPreferences</b><br>savefood_session keys: identity, role and login state. No password is saved in the session.</div><div class="relation"><b>Static ArrayList</b><br>CartManager selections. Process-local; cleared on logout/account change and lost after process termination.</div></div></div></div>'+
 '<div class="section-head"><h2>Inspect the real schema.</h2><span class="small">Click a table to see its fields</span></div><div class="tabs" role="group" aria-label="Database tables">'+D.tables.map((t,i)=>'<button data-table="'+i+'" class="'+(i===tableIndex?'selected':'')+'">'+esc(t.name)+'</button>').join('')+'</div><div class="card"><span class="tag">'+esc(t.entity)+'.java</span><h2>'+esc(t.name)+'</h2><p>'+esc(t.purpose)+'</p><p class="small"><b>Primary key:</b> '+esc(t.pk)+' · <b>DAO:</b> '+esc(t.dao)+'</p><p class="small"><b>Foreign keys:</b> '+esc(t.fk)+'</p><div class="fields">'+t.fields.map(f=>'<div class="field">'+esc(f.name)+' <span>'+esc(f.type)+'</span></div>').join('')+'</div><div class="source-chips">'+chip(t.entity)+chip(t.dao)+'</div></div>'+
 '<div class="table-wrap"><table><thead><tr><th>Table</th><th>Primary key</th><th>Relationship</th></tr></thead><tbody>'+D.tables.map(t=>'<tr><td><code>'+t.name+'</code></td><td><code>'+t.pk+'</code></td><td>'+esc(t.fk)+'</td></tr>').join('')+'</tbody></table></div>'+
 '<div class="grid2"><div class="card"><h3>A safe checkout, step by step</h3>'+[['Validate caller and cart','Current customer, nonempty cart, Pickup or Delivery.'],['Begin the Room transaction','Insert a Pending order header.'],['Validate every current food row','Active, correct restaurant, enough stock, same current price.'],['Write the order lines and stock','Save name/price snapshots and subtract quantity.'],['Update total and commit','On failure roll back the writes; on success clear the cart.']].map(s=>'<div class="flow-step"><b>'+s[0]+'</b><p>'+s[1]+'</p></div>').join('')+'</div><div class="card"><h3>What to explain in the demo</h3><p>A restaurant can have many foods and orders. An order belongs to a customer and restaurant, contains order lines, and can have a saved reminder.</p><p>The schema permits multiple restaurants per manager; current FoodCatalog logic selects the first owned restaurant. The one-reminder rule is checked in code, rather than enforced by a unique orderId constraint.</p><p>The app retains allowMainThreadQueries for the classroom design. Larger queries can delay the screen; this is a current limitation, not an instruction to add new architecture.</p><div class="notice warm">Room does not synchronize devices. Demonstrate the customer/manager exchange by switching accounts on one installation. GitHub shares source code, not that installation’s SQLite data.</div></div></div>'}
function log(message){sim.log.unshift(message);sim.log=sim.log.slice(0,14)}
function saveSim(){write(PRACTICE_KEY,sim)}
function availableNext(o){if(o.status==='Pending')return['Accepted','Rejected'];if(o.status==='Accepted')return['Ready'];if(o.status==='Ready')return[o.type==='Pickup'?'Picked Up':'Delivered'];return[]}
function orderCard(o){const manager=sim.role==='manager';let buttons='';if(manager){buttons=availableNext(o).map(s=>'<button data-order="'+o.id+'" data-next="'+s+'">'+({Accepted:'Accept',Rejected:'Reject',Ready:'Mark Ready','Picked Up':'Mark Picked Up',Delivered:'Mark Delivered'}[s])+'</button>').join('');if(o.status==='Ready'&&!o.reminder)buttons+='<button data-remind="'+o.id+'">Save reminder</button>'}else if(o.status==='Pending'){buttons='<button data-cancel="'+o.id+'">Cancel Pending order</button>'}
 return '<div class="order-card" data-order-card="'+o.id+'"><div class="mini-row"><h3>Order #'+o.id+'</h3><b>'+money(o.total)+'</b></div><span class="tag '+(o.status==='Pending'?'warm':'')+'">'+esc(o.status)+'</span><p>'+o.qty+' × Vegetable Sandwich at '+money(o.unitPrice)+'<br>'+o.type+' · '+esc(o.date)+'</p>'+(o.reminder?'<div class="notice" style="font-size:11px;padding:10px;margin:8px 0"><b>Saved reminder</b><br>'+esc(o.reminder.message)+'<br>'+esc(o.reminder.at)+'</div>':'<p>No saved reminder.</p>')+'<div class="order-actions">'+buttons+'</div></div>'}
function lab(){const manager=sim.role==='manager';const active=sim.orders.filter(o=>['Pending','Accepted','Ready'].includes(o.status));return intro('05','Follow one shared order.','Practice the current rules in a browser model. Switch roles to see the same records. The invented dataset below is separate from the Android app and never seeds its database.')+
 '<div class="tabs"><button data-role="customer" class="'+(!manager?'selected':'')+'">Customer</button><button data-role="manager" class="'+(manager?'selected':'')+'">Manager</button><button data-action="restart-model">↻ Restart model</button><button data-action="reset-model">Reset practice data</button></div>'+

 (manager?'<form id="price-form"><label for="newPrice">Edit current discounted price</label><input id="newPrice" type="number" min=".01" max="1000" step=".01" value="'+sim.price.toFixed(2)+'" required><button type="submit">Save menu price</button></form><button data-action="toggle-active">'+(sim.active?'Deactivate listing':'Reactivate listing')+'</button><p class="tiny">Old orders retain their purchased unit price. Removal in Android uses active=false.</p>':
 '<form id="cart-form"><label for="qty">Quantity to add</label><input id="qty" type="number" min="1" step="1" value="1" required><button class="primary" type="submit" '+(!sim.active||sim.stock===0?'disabled':'')+'>Add to cart</button></form><div class="order-card"><b>Cart · '+(cart?cart.qty:0)+' units</b><p>'+(cart?money(cart.unitPrice)+' each · '+money(cart.qty*cart.unitPrice)+' total':'Temporary selection. No order saved yet.')+'</p>'+(cart?'<button data-action="clear-cart">Clear cart</button>':'')+'</div><form id="checkout-form"><label for="fulfillment">Fulfillment</label><select id="fulfillment"><option>Pickup</option><option>Delivery</option></select><button class="primary" type="submit" '+(!cart?'disabled':'')+'>Confirm order</button></form>')+
 '<h3 style="margin-top:25px">'+(manager?'Orders & history':'My orders & history')+'</h3>'+(sim.orders.length?sim.orders.slice().reverse().map(orderCard).join(''):'<p>No confirmed orders yet. Place one as Customer first.</p>')+'</div><div class="phone-foot"><i></i></div></div></div>'+
 '<div class="stack"><div class="card"><span class="tag">Same records · both roles</span><h3>Watch the data change.</h3><div class="lab-stats"><div><b>'+sim.stock+'</b>stock remaining</div><div><b>'+active.length+'</b>active orders</div><div><b>'+sim.orders.filter(o=>o.reminder).length+'</b>saved reminders</div></div><div class="log" id="practiceLog">'+sim.log.map(x=>'<div>• '+esc(x)+'</div>').join('')+'</div></div><div class="card"><h3>Try three branches</h3><ol class="rule-list"><li><b>Success:</b> order 2 units → stock 5 to 3 → Manager accepts → Ready → save reminder → Picked Up/Delivered. Stock stays at 3.</li><li><b>Cancellation:</b> place a separate order → Customer cancels while Pending → stock returns. Cancelling again is unavailable.</li><li><b>Rejection:</b> place another order → Manager rejects Pending → stock returns. The same terminal order cannot return stock again.</li></ol><p>Use Reset practice data to start again at 5. Try Delivery completion, price edits after purchase, an inactive listing, and a restart with an unconfirmed cart.</p></div><div class="notice"><b>Persistence model:</b> browser practice orders and reminders are saved locally when storage is available; cart selection is memory only. Restart model clears the cart and rereads saved records. Switching roles clears the cart, matching an Android account change.</div><div class="card"><h3>Connect it to Java</h3><div class="source-chips">'+['CartManager','OrderManager','ManagerOrderStore','OrderDao','OrderStatusActivity'].map(chip).join('')+'</div><p>This lab simplifies registration, navigation and the UI. It is an executable teaching model of the ordering rules, not a reproduction or test of Android Activities.</p></div></div></div>'}
function quiz(){if(quizIndex>=D.quiz.length){const p=Math.round(100*quizScore/D.quiz.length);progress.quizBest=Math.max(progress.quizBest,p);saveProgress();return intro('06','Explain it with confidence.','The questions have been updated to the Room implementation.')+'<div class="card quiz"><span class="tag">Round complete</span><h1>'+quizScore+' / '+D.quiz.length+'</h1><p class="lead">'+(p>=85?'You have a strong grasp of the current workflow. Now explain the same ideas aloud without the answer choices.':'Review the lessons and the explanations you missed, then try another round.')+'</p><p>Best result in this browser: <b>'+progress.quizBest+'%</b></p><button class="primary" data-action="quiz-reset">Try again</button> <a href="#lessons" class="button">Review lessons</a></div>'}const q=D.quiz[quizIndex];return intro('06','Can you explain SaveFood?','Choose an answer, read the feedback and connect it to the actual code.')+'<div class="card quiz"><div class="mini-row"><span class="tag">Question '+(quizIndex+1)+' of '+D.quiz.length+'</span><span class="small">'+quizScore+' correct</span></div><div class="quiz-meter"><span style="width:'+(100*quizIndex/D.quiz.length)+'%"></span></div><h2>'+esc(q.q)+'</h2><div class="quiz-options">'+q.a.map((a,i)=>'<button data-answer="'+i+'" '+(quizChoice!==null?'disabled':'')+' class="'+(quizChoice===null?'':i===q.right?'correct':i===quizChoice?'wrong':'')+'"><b>'+String.fromCharCode(65+i)+'</b>'+esc(a)+'</button>').join('')+'</div>'+(quizChoice!==null?'<div class="notice '+(quizChoice===q.right?'':'warm')+'"><b>'+(quizChoice===q.right?'Correct.':'Review this point.')+'</b> '+esc(q.why)+'</div><button class="primary" data-action="quiz-next">'+(quizIndex===D.quiz.length-1?'See results':'Next question →')+'</button>':'<p class="small">Try saying your answer in your own words first.</p>')+'</div>'}

 '<div class="table-wrap"><table><thead><tr><th>Requirement area</th><th>Current source</th><th>Verify or prepare separately</th></tr></thead><tbody>'+D.requirements.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join('')+'</tbody></table></div>'+
 '<div class="grid2"><div class="card"><h3>My explanation & demo checklist</h3>'+CHECKS.map((x,i)=>'<div class="check-row"><input type="checkbox" id="readiness-'+i+'" data-check="'+i+'" '+(progress.checks.includes(i)?'checked':'')+'><label for="readiness-'+i+'"><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></label></div>').join('')+'</div><div class="stack"><div class="card"><h3>A presentation route that makes sense</h3>'+[['Set the context · 2 min','Purpose, users and the three modules.'],['Show accounts and inventory · 3 min','Register/login, restaurant setup and a valid listing.'],['Follow the order · 6 min','Customer checkout → manager decision → Ready/reminder → customer status and history.'],['Show the data and rules · 3 min','Six tables, relationships, snapshots and stock restoration.'],['Close with limitations and questions · 3–5 min','Show cancellation/rejection and explain local data and the temporary cart.']].map(s=>'<div class="flow-step"><b>'+s[0]+'</b><p>'+s[1]+'</p></div>').join('')+'</div><div class="notice warm"><b>Protect existing demonstration data.</b> The inner project handoff asks you to preserve the development app’s data. Use Database Inspector read-only; run automated instrumented tests on a separate disposable emulator. A source review is not a fresh Android runtime pass.</div><div class="card"><h3>Course deliverables</h3><p>The provided project instructions list final submission on November 26 and presentations on November 24 / December 3. Confirm your group’s slot and current Blackboard announcements.</p><p>Prepare to explain your own work thoroughly and cite additional features and assistance as required by the course documents. The learning companion is not the final technical report.</p></div></div></div>'}

 [['https://developer.android.com/training/data-storage/room','Room and its three components','Compare entities, DAO interfaces and the database class.'],['https://developer.android.com/training/data-storage/room/accessing-data','Data access objects','Understand @Insert, @Update and @Query.'],['https://developer.android.com/training/data-storage/shared-preferences','SharedPreferences','Connect key/value persistence to savefood_session.'],['https://developer.android.com/guide/components/activities/activity-lifecycle','Activity lifecycle','Understand onCreate, onResume and returning to a screen.']].map(x=>'<a class="link-card" href="'+x[0]+'" target="_blank" rel="noopener"><b>'+x[1]+' ↗</b><span>'+x[2]+'</span></a>').join('')+
 '<div class="notice">The live project uses Room runtime/compiler 2.8.5, with annotationProcessor for Java, matching the provided week 9 lecture. Online documentation can show newer versions or Kotlin examples; use it for concepts while following the agreed project configuration.</div></div></div>'+
 '<div class="section-head"><h2>From class example to SaveFood</h2></div><div class="table-wrap"><table><thead><tr><th>Class concept</th><th>Class example</th><th>Current SaveFood use</th></tr></thead><tbody><tr><td>Persistent keys</td><td>Week 8 CH11 / SharedPreferences</td><td>savefood_session in Login and Profile</td></tr><tr><td>@Entity and primary key</td><td>Week 9 Product.java</td><td>UserEntity, FoodItemEntity and four more entities</td></tr><tr><td>@Dao CRUD</td><td>Week 9 ProductDAO.java / CW7</td><td>UserDao, RestaurantDao, FoodItemDao and OrderDao</td></tr><tr><td>RoomDatabase</td><td>Week 9 AppDatabase.java</td><td>Shared savefood_database instance, version 1</td></tr><tr><td>Relationships and SQL</td><td>Week 9 multi-table examples / JOIN lecture</td><td>Foreign keys and scoped DAO queries; order conversion uses several queries rather than a JOIN</td></tr></tbody></table></div>'+

document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.module){moduleId=t.dataset.module;render();return}
 if(t.dataset.lesson!==undefined){lessonIndex=Number(t.dataset.lesson);render();return}
 if(t.dataset.lessonMove){lessonIndex=Math.max(0,Math.min(D.lessons.length-1,lessonIndex+Number(t.dataset.lessonMove)));render();return}
 if(t.dataset.understood!==undefined){const i=Number(t.dataset.understood);progress.lessons=progress.lessons.includes(i)?progress.lessons.filter(n=>n!==i):progress.lessons.concat(i);saveProgress();render();return}
 if(t.dataset.code!==undefined){codeIndex=Number(t.dataset.code);render();return}
 if(t.dataset.table!==undefined){tableIndex=Number(t.dataset.table);render();return}
 if(t.dataset.answer!==undefined&&quizChoice===null){quizChoice=Number(t.dataset.answer);if(quizChoice===D.quiz[quizIndex].right)quizScore++;render();return}
 if(t.dataset.role){if(sim.role!==t.dataset.role){cart=null;sim.role=t.dataset.role;log('Switched to '+sim.role+'. The unconfirmed cart was cleared.');saveSim()}render();return}
 if(t.dataset.next){const o=sim.orders.find(o=>o.id===Number(t.dataset.order));if(!o||sim.role!=='manager'||!availableNext(o).includes(t.dataset.next))return;const next=t.dataset.next;o.status=next;if(next==='Rejected')sim.stock+=o.qty;log('Order #'+o.id+' → '+next+'. Stock: '+sim.stock+'.');saveSim();render();return}
 if(t.dataset.cancel){const o=sim.orders.find(o=>o.id===Number(t.dataset.cancel));if(!o||sim.role!=='customer'||o.status!=='Pending')return;o.status='Cancelled';sim.stock+=o.qty;log('Customer cancelled #'+o.id+'; '+o.qty+' units returned. Stock: '+sim.stock+'.');saveSim();render();return}
 if(t.dataset.remind){const o=sim.orders.find(o=>o.id===Number(t.dataset.remind));if(!o||sim.role!=='manager'||o.status!=='Ready'||o.reminder)return;o.reminder={message:'Your SaveFood order #'+o.id+' is ready for '+o.type.toLowerCase()+'.',at:new Date().toLocaleString()};log('Ready reminder saved for #'+o.id+'. No external notification sent.');saveSim();render();return}
 const action=t.dataset.action;
 if(action==='quiz-next'){quizIndex++;quizChoice=null;render()}
 if(action==='quiz-reset'){quizIndex=0;quizChoice=null;quizScore=0;render()}
 if(action==='clear-cart'){cart=null;render()}
 if(action==='toggle-active'){sim.active=!sim.active;log('Listing is now '+(sim.active?'active.':'inactive.'));saveSim();render()}
 if(action==='restart-model'){cart=null;sim=read(PRACTICE_KEY,sim);log('Model restarted. Saved orders retained; unconfirmed cart cleared.');saveSim();render();toast('Saved orders retained. Cart cleared.')}
 if(action==='reset-model'){if(window.confirm('Reset only this browser’s invented practice orders, stock and reminders? Learning progress and Android data are unaffected.')){sim=seed();cart=null;saveSim();render()}}
 if(action==='copy-code'){try{await navigator.clipboard.writeText(D.code[codeIndex].snippet);toast('Excerpt copied.')}catch(e){toast('Copy unavailable here. Select the excerpt text to copy it.')} }
 if(action==='export'){const payload={guide:'SaveFood Room Learning Guide',sourceCommit:D.sha,exportedAt:new Date().toISOString(),lessonsUnderstood:progress.lessons.map(i=>D.lessons[i]?.title).filter(Boolean),checks:progress.checks.map(i=>CHECKS[i]?.[0]).filter(Boolean),quizBestPercent:progress.quizBest};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SaveFood_Learning_Progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress exported.')}
 if(action==='print')window.print();
 if(action==='print-guide')printAll();
});
document.addEventListener('change',e=>{if(e.target.dataset.check!==undefined){const i=Number(e.target.dataset.check);progress.checks=e.target.checked?Array.from(new Set(progress.checks.concat(i))):progress.checks.filter(n=>n!==i);saveProgress()}});
document.addEventListener('submit',e=>{
 if(e.target.id==='cart-form'){e.preventDefault();const qty=Number($('#qty').value);const total=qty+(cart?cart.qty:0);if(!Number.isInteger(qty)||qty<1||!sim.active||total>sim.stock){toast('Choose a positive whole quantity within current stock.');return}cart={qty:total,unitPrice:sim.price};log('Cart holds '+total+' units. No order saved and no stock changed yet.');saveSim();render();toast('Added to the temporary cart.')}
 if(e.target.id==='checkout-form'){e.preventDefault();const type=$('#fulfillment').value;if(!cart||!sim.active||cart.qty>sim.stock||cart.unitPrice!==sim.price||!['Pickup','Delivery'].includes(type)){toast('Checkout failed validation. No order or stock change was saved.');return}const o={id:sim.nextId++,qty:cart.qty,unitPrice:sim.price,total:cart.qty*sim.price,type,status:'Pending',date:new Date().toLocaleString(),reminder:null};sim.stock-=cart.qty;sim.orders.push(o);cart=null;log('Committed order #'+o.id+' + lines + stock. Pending; '+money(o.total)+'; stock '+sim.stock+'.');saveSim();render();toast('Order saved. Switch to Manager to process the same order.')}
 if(e.target.id==='price-form'){e.preventDefault();const price=Number($('#newPrice').value);if(!Number.isFinite(price)||price<=0||price>1000){toast('Enter a valid positive practice price.');return}sim.price=Math.round(price*100)/100;log('Current menu price is '+money(sim.price)+'. Purchased snapshots stay unchanged.');saveSim();render()}
});
